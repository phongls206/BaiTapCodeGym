<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục với display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        nav {
            margin: 15px 0;
            padding: 10px;
            background-color: #eaeaea;
        }

        nav a {
            display: inline-block;
            margin: 0 15px;
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        section {
            margin-top: 20px;
        }

        .box {
            display: inline-block;
            width: 28%;
            max-width: 300px;
            padding: 30px 20px;
            background-color: lightblue;
            margin: 10px;
            box-sizing: border-box;
            vertical-align: top;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        footer {
            margin-top: 40px;
            padding: 15px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Bố cục trang web với display</h1>
    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Giới thiệu</a>
        <a href="#">Dịch vụ</a>
        <a href="#">Liên hệ</a>
    </nav>
    <section>
        <div class="box">Cột 1</div>
        <div class="box">Cột 2</div>
        <div class="box">Cột 3</div>
    </section>
    <footer>
        <p>Bản quyền &copy; 2026</p>
    </footer>
</body>
</html>
