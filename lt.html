<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
            color: #333;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Dell Inspiron</td>
                <td>18,500,000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Chuột không dây Logitech</td>
                <td>450,000 VNĐ</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Gaming</td>
                <td>1,200,000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Màn hình LG 27 inch</td>
                <td>4,300,000 VNĐ</td>
                <td>8</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
