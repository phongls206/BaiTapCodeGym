<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập: Sử dụng bộ chọn CSS</title>
    <style>
        /* 1. Bộ chọn phần tử (Element Selector): Đổi màu nền của trang */
        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
            padding: 30px;
            line-height: 1.6;
        }

        /* 2. Bộ chọn nhóm (Grouping Selector): Định dạng chung cho h1 và p */
        h1, p {
            color: #1e293b;
            margin-bottom: 16px;
        }

        /* 3. Bộ chọn ID (ID Selector): Căn giữa tiêu đề <h1> */
        #main-title {
            text-align: center;
            color: #0f172a;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 10px;
        }

        /* 4. Bộ chọn lớp (Class Selector): Định dạng danh sách với màu sắc khác nhau */
        .hobby-list {
            background-color: #ffffff;
            padding: 15px 35px;
            border-radius: 8px;
        }

        .color-red {
            color: #dc2626;
            font-weight: bold;
        }

        .color-green {
            color: #16a34a;
            font-weight: bold;
        }

        .color-blue {
            color: #2563eb;
            font-weight: bold;
        }

        /* Định dạng nút bấm */
        .btn {
            margin-top: 15px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        /* 5. Bộ chọn lớp giả (Pseudo-class Selector): Hiệu ứng hover cho nút bấm */
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề <h1> -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Đoạn văn <p> mô tả bản thân -->
    <p>Xin chào! Tôi là một sinh viên đam mê lập trình web, yêu thích tìm hiểu HTML và CSS để xây dựng giao diện trang web.</p>

    <!-- Danh sách <ul> liệt kê 3 sở thích -->
    <ul class="hobby-list">
        <li class="color-red">Lập trình ứng dụng web</li>
        <li class="color-green">Đọc sách công nghệ</li>
        <li class="color-blue">Chơi thể thao</li>
    </ul>

    <!-- Nút bấm <button> -->
    <button class="btn">Nhấn vào đây</button>

</body>
</html>
