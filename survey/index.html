<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Research Survey</title>
    <style>
        body {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
            background-color: #ffffff;
            color: #222;
            margin: 0;
            padding: 30px;
        }
        .survey-container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #222;
        }
        .subtitle {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
        }
        label, .question-title {
            font-weight: bold;
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
        }
        .radio-item, .checkbox-item {
            margin-bottom: 8px;
            font-weight: normal;
        }
        .radio-item input, .checkbox-item input {
            margin-right: 8px;
        }
        .other-input {
            margin-top: 5px;
            margin-left: 20px;
            padding: 5px;
            width: 150px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .price-container {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        .price-container span {
            font-size: 16px;
        }
        .price-container input[type="text"] {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .dollars {
            width: 60px;
        }
        .cents {
            width: 40px;
        }
        .price-labels {
            display: flex;
            gap: 25px;
            font-size: 12px;
            color: #666;
            margin-top: 2px;
            margin-left: 15px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        .footer-text {
            margin-top: 20px;
            font-size: 14px;
        }
        .powered-by {
            text-align: right;
            margin-top: 40px;
            font-size: 12px;
            color: #777;
        }
        .powered-by span {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="survey-container">
    <h1>Market Research Survey</h1>
    <div class="subtitle">Please take a few moments to complete this satisfaction survey.</div>

    <form action="#" method="POST">
        
        <!-- Câu hỏi 1: Độ tuổi -->
        <div class="question-group">
            <label for="age-range">What is your age range?</label>
            <select id="age-range" name="age_range">
                <option value="18-24">18-24</option>
                <option value="25-34">25-34</option>
                <option value="35-44">35-44</option>
                <option value="45-54">45-54</option>
                <option value="55+">55+</option>
            </select>
        </div>

        <!-- Câu hỏi 2: Thu nhập -->
        <div class="question-group">
            <label for="income-range">What is your yearly income range?</label>
            <select id="income-range" name="income_range">
                <option value="0-25000">$0 - $25,000</option>
                <option value="25001-50000">$25,001 - $50,000</option>
                <option value="50001-75000">$50,001 - $75,000</option>
                <option value="75001+">$75,001+</option>
            </select>
        </div>

        <!-- Câu hỏi 3: Giới tính -->
        <div class="question-group">
            <label>Gender Identity</label>
            <div class="radio-item"><input type="radio" id="male" name="gender" value="Male"><label for="male" style="display:inline; font-weight:normal;">Male</label></div>
            <div class="radio-item"><input type="radio" id="female" name="gender" value="Female"><label for="female" style="display:inline; font-weight:normal;">Female</label></div>
            <div class="radio-item"><input type="radio" id="nonbinary" name="gender" value="Nonbinary"><label for="nonbinary" style="display:inline; font-weight:normal;">Nonbinary</label></div>
            <div class="radio-item">
                <input type="radio" id="other" name="gender" value="Other"><label for="other" style="display:inline; font-weight:normal;">Other</label>
                <br>
                <input type="text" class="other-input" name="gender_other">
            </div>
        </div>

        <!-- Câu hỏi 4: Sản phẩm đã mua -->
        <div class="question-group">
            <label>Which of the following products have your purchased in the last 2 months. Please check all that apply.</label>
            <div class="checkbox-item"><input type="checkbox" id="prod1" name="products" value="Product 1"><label for="prod1" style="display:inline; font-weight:normal;">Product 1</label></div>
            <div class="checkbox-item"><input type="checkbox" id="prod2" name="products" value="Product 2"><label for="prod2" style="display:inline; font-weight:normal;">Product 2</label></div>
            <div class="checkbox-item"><input type="checkbox" id="prod3" name="products" value="Product 3"><label for="prod3" style="display:inline; font-weight:normal;">Product 3</label></div>
        </div>

        <!-- Câu hỏi 5: Tần suất sử dụng -->
        <div class="question-group">
            <label>How often would you use our new product?</label>
            <div class="radio-item"><input type="radio" id="daily" name="usage_frequency" value="Daily"><label for="daily" style="display:inline; font-weight:normal;">Daily</label></div>
            <div class="radio-item"><input type="radio" id="weekly" name="usage_frequency" value="Weekly"><label for="weekly" style="display:inline; font-weight:normal;">Weekly</label></div>
            <div class="radio-item"><input type="radio" id="monthly" name="usage_frequency" value="Monthly"><label for="monthly" style="display:inline; font-weight:normal;">Monthly</label></div>
        </div>

        <!-- Câu hỏi 6: Mức giá sẵn sàng trả -->
        <div class="question-group">
            <label>What would you pay for the new product?</label>
            <div class="price-container">
                <span>$</span>
                <input type="text" class="dollars" name="price_dollars">
                <span>.</span>
                <input type="text" class="cents" name="price_cents">
            </div>
            <div class="price-labels">
                <span>Dollars</span>
                <span>Cents</span>
            </div>
        </div>

        <!-- Câu hỏi 7: Tính năng mong muốn -->
        <div class="question-group">
            <label for="features">What features would you like to see in the new product.</label>
            <textarea id="features" name="features"></textarea>
        </div>

        <!-- Dòng chú thích cuối -->
        <div class="footer-text">
            Please rate your level of agreement with the following statements.
        </div>

        <!-- Footer nguồn Wufoo -->
        <div class="powered-by">
            Powered by <span>Wufoo</span>
        </div>

    </form>
</div>

</body>
</html>
