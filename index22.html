<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập CSS Box Model</title>
    <style>
        /* Thiết lập chung cho trang */
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* Định dạng chung cho các thẻ .card */
        .card {
            width: 280px;
            height: 150px;
            padding: 20px;
            border: 5px solid #3498db;
            margin: 20px;
        }

        /* Thẻ đầu tiên: content-box (Mặc định) */
        .card:nth-child(2) {
            box-sizing: content-box;
            background-color: #2ecc71; /* Xanh lá cây */
        }

        /* Thẻ thứ hai: border-box */
        .card:nth-child(3) {
            box-sizing: border-box;
            background-color: #f1c40f; /* Vàng */
        }

        /* Thẻ thứ ba: border-box (Nền đỏ) */
        .card:nth-child(4) {
            box-sizing: border-box;
            background-color: #e74c3c; /* Đỏ */
        }
    </style>
</head>
<body>

    <h1>Thực hành CSS Box Model</h1>

    <div class="card">
        <h3>Thẻ 1: content-box</h3>
        <p>Đây là thẻ đầu tiên sử dụng box-sizing: content-box.</p>
    </div>

    <div class="card">
        <h3>Thẻ 2: border-box</h3>
        <p>Đây là thẻ thứ hai sử dụng box-sizing: border-box.</p>
    </div>

    <div class="card">
        <h3>Thẻ 3: border-box</h3>
        <p>Đây là thẻ thứ ba sử dụng box-sizing: border-box (nền đỏ).</p>
    </div>

</body>
</html>
